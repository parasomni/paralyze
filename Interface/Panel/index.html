<body>
  <div class="interface">
    <h1>
      <span class="glitch-text" data-text="PARALYZE">PARALYZE</span> - Control Interface
    </h1>

    <div class="button-grid">
      <div class="button-group">
        <h2>Agent</h2>
        <button id="builder-btn">Builder</button>
        <button id="management-btn">Management</button>
        <button id="instructions-btn" onclick="openInstructionsModal()">Instructions</button>
      </div>
      <div class="button-group">
        <h2>Server</h2>
        <button id="c2-btn">C2</button>
        <button onclick="openDBModal()">Databases</button>
        <button onclick="openLogsModal()">Logs</button>
      </div>
      <div class="button-group">
        <h2>Options</h2>
        <button id="open-settings-btn" onclick="openModal()">Settings</button>
        <button>Documentation</button>
      </div>
    </div>

    <div class="footer">
      <div class="footer-status">
        <div class="status-field">
          <label>Agents online:</label>
          <span class="pill pill-glow">531</span>
        </div>
        <div class="status-field">
          <label>C2:</label>
          <span class="pill pill-connected">Connected</span>
        </div>
        <div class="status-field">
          <label>DB:</label>
          <span class="pill pill-offline">Offline</span>
        </div>
      </div>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <canvas id="neuron-canvas"></canvas>

  <script>
    const canvas = document.getElementById('neuron-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    function resize() {
      width = canvas.width = innerWidth;
      height = canvas.height = innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 3.0,
        vy: (Math.random() - 0.5) * 3.0,
      });
    }

    function animate() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,200,255,0.8)';
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const q = particles[j];
          const dx = p.x - q.x, dy = p.y - q.y;
          const dist = dx*dx + dy*dy;
          if (dist < 10000) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(0,200,255,${1 - dist/10000})`;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
<!-- Logs Modal -->
<div class="modal" id="logs-modal">
  <div class="modal-content wide">
    <h2>Logs</h2>

    <div class="logs-toolbar">
      <label>
        Open log file:
        <input type="file" id="logs-file-input" accept=".log,.txt,.out,.text"/>
      </label>

      <label>
        Module:
        <select id="logs-module-filter">
          <option value="">(All)</option>
          <!-- ServerInstance -->
          <option>BASE</option>
          <option>COMMAND</option>
          <option>CONTROL</option>
          <option>LOGANALYZER</option>
          <option>CRYPT</option>
          <option>DATA</option>
          <option>ESSENTIALS</option>
          <option>LOGSENDER</option>
          <option>AUTHENTICATOR</option>
          <option>DBCONTROLLER</option>
          <option>CONFIG</option>
          <!-- BotModules -->
          <option>LOADER</option>
          <option>DOS</option>
          <option>PROXY</option>
          <option>MAINTENANCE</option>
          <option>NUKE</option>
          <option>EXFILTRATION</option>
          <option>NETWORK</option>
        </select>
      </label>

      <label>
        Level:
        <select id="logs-level-filter">
          <option value="">(All)</option>
          <option>TRACE</option>
          <option>DEBUG</option>
          <option>INFO</option>
          <option>WARNING</option>
          <option>ERROR</option>
          <option>FATAL</option>
        </select>
      </label>

      <button id="logs-clear-btn" type="button" title="Clear loaded log">Clear</button>
    </div>

    <textarea id="logs-viewer" readonly placeholder="Open a log file to display its contents…"></textarea>

    <div class="modal-actions">
      <button onclick="closeLogsModal()">Back</button>
      <span style="opacity:.65;align-self:center;font-family:monospace">Read-only</span>
    </div>
  </div>
</div>

<script>
  (function(){
    const modal      = document.getElementById('logs-modal');
    const fileInput  = document.getElementById('logs-file-input');
    const moduleSel  = document.getElementById('logs-module-filter');
    const levelSel   = document.getElementById('logs-level-filter');
    const viewer     = document.getElementById('logs-viewer');
    const clearBtn   = document.getElementById('logs-clear-btn');

    let parsed = []; 
    window.openLogsModal  = function() {
      document.body.classList.add('modal-open');
      modal.classList.add('visible');
    };
    window.closeLogsModal = function() {
      document.body.classList.remove('modal-open');
      modal.classList.remove('visible');
    };

    function parseLine(line) {
      const re = /^\[(?<ts>[\d-]{10}\s[\d:]{8})\]\s*--\[(?<module>[A-Z]+)\]\[(?<level>[A-Z]+)\]:\s?(?<msg>.*)$/;
      const m = line.match(re);
      if (!m) return null;
      return {
        ts: m.groups.ts,
        module: m.groups.module,
        level: m.groups.level,
        message: m.groups.msg,
        raw: line
      };
    }

    function render() {
      const mFilter = (moduleSel.value || '').trim();
      const lFilter = (levelSel.value  || '').trim();

      const lines = parsed.filter(row => {
        const byModule = !mFilter || row.module === mFilter;
        const byLevel  = !lFilter || row.level  === lFilter;
        return byModule && byLevel;
      }).map(row => row.raw);

      viewer.value = lines.join('\n');
    }

    function reset() {
      parsed = [];
      viewer.value = '';
      fileInput.value = '';
      render();
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const text = await file.text();
      const lines = text.split(/\r?\n/);
      parsed = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const p = parseLine(line);
        parsed.push(p ? p : { raw: line, ts: null, module: null, level: null, message: null });
      }
      render();
    });

    moduleSel.addEventListener('change', render);
    levelSel.addEventListener('change', render);
    clearBtn.addEventListener('click', reset);
  })();
</script>

</body>
</html>
