<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paralyze - Control Interface</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="interface">
    <h1>Paralyze - Control Interface</h1>
    <div class="grid">
      <div class="column agent">
        <h2>Agent</h2>
        <button>Builder</button>
        <button>Management</button>
        <button>Shutdown</button>
      </div>
      <div class="center">
        <img src="assets/logo.png" alt="Paralyze Logo" class="logo" />
        <button>Settings</button>
        <button>Documentation</button>
      </div>
      <div class="column server">
        <h2>Server</h2>
        <button>Control Server</button>
        <button>Command Server</button>
        <button>Databases</button>
        <button>Logs</button>
      </div>
    </div>
    <div class="footer">
      <span>Online:</span>
      <span class="version">v1.0.0</span>
    </div>
  </div>
</body>
</html>
